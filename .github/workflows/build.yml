name: build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Add dependency chart repos
        run: |
          helm repo add postgresql https://charts.bitnami.com/bitnami
          helm repo add clickhouse https://charts.bitnami.com/bitnami
#          cd dittofeed
#          helm dependency update
      - name: Package chart
        id: package
        run: echo "CHART_LOCATION=$(helm package rudderstack | awk '/Successfully packaged chart and saved it to:/ {print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Publish chart
        run: |
          helm registry login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} ghcr.io
          helm push ${{ steps.package.outputs.CHART_LOCATION }} oci://ghcr.io/${{ github.repository }}
